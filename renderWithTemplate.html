<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Method 3 - Template</title>
</head>
<body>
    <input type="text" id="todoInput" placeholder="Task likhein...">
    <button id="addBtn">Add</button>
    <ul id="todoList"></ul>

    <!-- Template Tag -->
    <template id="todo-template">
        <li>
            <span class="todo-text"></span>
            <button class="delete-btn">Delete</button>
        </li>
    </template>

    <!-- JavaScript file link -->
    <script src="renderWithInnerhtml.js"></script>
</body>
</html>
