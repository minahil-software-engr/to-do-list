<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Challenge - LocalStorage To-Do List</title>
</head>
<body>
    <h2>My To-Do List (Persistent)</h2>
    <input type="text" id="todoInput" placeholder="Task likhein...">
    <button id="addBtn">Add</button>
    <ul id="todoList"></ul>
    <template id="todo-template">
        <li>
            <span class="todo-text"></span>
            <button class="delete-btn">Delete</button>
        </li>
    </template>
    <script src="challenge.js"></script>
</body>
</html>
